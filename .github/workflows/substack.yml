name: Substack
run-name: Substack ${{ inputs.mode }} — ${{ inputs.post }}

on:
  workflow_dispatch:
    inputs:
      post:
        description: Post filename in posts/ (e.g. everything-is-a-lot)
        required: true
        type: string
      mode:
        description: Export, save a draft, or publish changes
        required: true
        default: export
        type: choice
        options:
          - export
          - draft
          - publish
      post_id:
        description: Existing Substack ID (optional; overrides automatic matching)
        type: string
      send_email:
        description: Email subscribers on first publish (publish mode only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: substack
  cancel-in-progress: false

jobs:
  substack:
    # Publish only the reviewed content on the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Substack integration
        run: bun run test:substack
      - name: Export for copy and paste
        if: inputs.mode == 'export'
        run: bun run substack
        env:
          SUBSTACK_POST: ${{ inputs.post }}
          SUBSTACK_MODE: export
      - name: Sync to Substack
        if: inputs.mode != 'export'
        run: bun run substack
        env:
          SUBSTACK_POST: ${{ inputs.post }}
          SUBSTACK_MODE: ${{ inputs.mode }}
          SUBSTACK_POST_ID: ${{ inputs.post_id }}
          SUBSTACK_SEND_EMAIL: ${{ inputs.send_email }}
          SUBSTACK_PUBLICATION_URL: ${{ vars.SUBSTACK_PUBLICATION_URL }}
          SUBSTACK_USER_ID: ${{ vars.SUBSTACK_USER_ID }}
          SUBSTACK_COOKIE_NAME: ${{ vars.SUBSTACK_COOKIE_NAME }}
          SUBSTACK_SESSION_TOKEN: ${{ secrets.SUBSTACK_SESSION_TOKEN }}
      - name: Upload export and sync result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: substack-export
          path: .substack-export/
          include-hidden-files: true
          if-no-files-found: ignore
